
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Data Table</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>People Data</h1>

<input type="text" id="searchInput" placeholder="Search by name or city">

<button id="sortNameButton" type="button">Sort by Name</button>
<button id="sortAgeButton" type="button">Sort by Age</button>

<table>
  <thead>
  <tr>
    <th>Name</th>
    <th>Age</th>
    <th>City</th>
  </tr>
  </thead>

  <tbody id="tableBody">
  </tbody>
</table>

<p id="resultCount"></p>

<script src="js/script.js">
</script>

</body>
</html>
